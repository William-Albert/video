<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haven - 守护你所爱的一切</title>
<style>
  /* 基础设置 */
  body, html {
    margin: 0; padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background-color: #f7f7f7;
    color: #111;
    transition: background-color 0.1s, color 0.1s;
  }

  /* 导航栏 */
  .nav {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 20px 40px; display: flex; justify-content: space-between;
    background: rgba(247, 247, 247, 0.9); z-index: 100;
  }
  
  /* 超级长的页面，强制你能滚动 */
  .section {
    height: 120vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 0 20px;
  }

  h1 { font-size: 50px; margin-bottom: 20px; }
  h2 { font-size: 40px; margin-bottom: 20px; }
  p { font-size: 20px; opacity: 0.7; max-width: 600px; }
  
  .camera-icon {
    width: 200px; height: 200px; border-radius: 50%;
    background: #222; margin: 40px 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  /* 监控画面 */
  .monitor {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; z-index: 999;
    opacity: 0; pointer-events: none; transition: opacity 1s;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 40px; box-sizing: border-box;
    font-family: monospace; color: #4ade80;
  }
  .monitor.active { opacity: 1; }
  
  /* 画面里的人影 */
  .figure {
    position: absolute; bottom: 20%; left: 50%;
    width: 150px; height: 350px;
    background: #000;
    filter: blur(15px);
    transform: translateX(-50%);
    border-radius: 50% 50% 10px 10px;
    opacity: 0.9;
  }

  /* 最后黑屏反转 */
  .final {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000; color: #fff; z-index: 1000;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 2s;
  }
  .final.active { opacity: 1; }
  .final p { font-size: 30px; letter-spacing: 5px; opacity: 0; transition: opacity 2s; }
  .final p.show { opacity: 1; }
</style>
</head>
<body>

<nav class="nav">
  <div style="font-weight: bold; font-size: 20px;">HAVEN</div>
  <div>
    <span id="nav1">产品</span> &nbsp;&nbsp;
    <span id="nav2">登录</span>
  </div>
</nav>

<!-- 这里的每一块都有 120vh 高，保证你能滚很久 -->
<div class="section">
  <h1>你的家，从未如此<em>安全</em>。</h1>
  <p>全天候守护你所爱的一切。</p>
  <div class="camera-icon"></div>
</div>

<div class="section">
  <h2 id="feat-title">一个设备，照顾到每一个角落。</h2>
  <p id="feat-desc">1080p 高清画面，随时随地查看家中的一切。</p>
</div>

<div class="section">
  <h2>用户的真实反馈</h2>
  <p id="review">“安装很简单，画面也很清晰。”</p>
</div>

<div class="section">
  <p style="font-size: 14px; opacity: 0.5;">（请继续用鼠标滚轮向下滚动）</p>
</div>

<!-- 监控画面 -->
<div class="monitor" id="monitor">
  <div style="display: flex; justify-content: space-between; font-size: 16px;">
    <span>CAM 04 · 客厅</span>
    <span style="color: red;">● REC</span>
  </div>
  <div class="figure"></div>
  <div style="display: flex; justify-content: space-between; font-size: 16px;">
    <span id="cam-status">检测到移动 · 1 个目标</span>
    <span>03:47:12</span>
  </div>
</div>

<!-- 最终结局 -->
<div class="final" id="final">
  <p id="msg1">2 个目标。</p>
  <p id="msg2" style="margin-top: 20px; color: #888;">其中一个是您。</p>
</div>

<!-- 核心 JavaScript 代码 -->
<script>
  // 获取元素
  const monitor = document.getElementById('monitor');
  const final = document.getElementById('final');
  const msg1 = document.getElementById('msg1');
  const msg2 = document.getElementById('msg2');
  const camStatus = document.getElementById('cam-status');
  const featTitle = document.getElementById('feat-title');
  const featDesc = document.getElementById('feat-desc');
  const review = document.getElementById('review');
  const nav1 = document.getElementById('nav1');
  const nav2 = document.getElementById('nav2');

  // 监听鼠标滚动
  window.addEventListener('scroll', function() {
    // 计算当前滚动了多少 (0 到 1)
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = Math.max(0, Math.min(1, scrollTop / docHeight));

    // 1. 页面颜色变黑 (进度 0 -> 1，背景从 247 变到 0)
    const bgColor = Math.floor(247 - (247 * progress));
    document.body.style.backgroundColor = 'rgb(' + bgColor + ',' + bgColor + ',' + bgColor + ')';
    
    // 文字颜色变白
    const txtColor = Math.floor(17 + (238 * progress));
    document.body.style.color = 'rgb(' + txtColor + ',' + txtColor + ',' + txtColor + ')';

    // 2. 文字悄悄改变
    if (progress > 0.2) {
      featTitle.innerText = '一个设备，看得到每一个角落。';
      featDesc.innerText = '它一直知道你在哪个房间。';
      nav1.innerText = '监控';
    }
    if (progress > 0.4) {
      review.innerText = '“我从来没有安装过这个。但它每天都会给我发通知。”';
      nav2.innerText = '正在观看';
    }

    // 3. 进度到 70% 时，监控画面淡入
    if (progress > 0.7) {
      monitor.classList.add('active');
    } else {
      monitor.classList.remove('active');
    }

    // 4. 进度到 90% 时，彻底黑屏，显示最终字幕
    if (progress > 0.9) {
      final.classList.add('active');
      camStatus.innerText = '检测到移动 · 2 个目标';
      
      // 延迟显示字幕，营造恐怖感
      setTimeout(function() { msg1.classList.add('show'); }, 500);
      setTimeout(function() { msg2.classList.add('show'); }, 2500);
    } else {
      final.classList.remove('active');
      msg1.classList.remove('show');
      msg2.classList.remove('show');
      camStatus.innerText = '检测到移动 · 1 个目标';
    }
  });
</script>
</body>
</html>
